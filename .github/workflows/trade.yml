name: 梭哈机器人

on:
  schedule:
    - cron: "7 * * * *" # 每小时第 7 分钟（UTC）跑一次；整点 GitHub 最挤，错开一点
  workflow_dispatch:
    inputs:
      only:
        description: "只跑这些机器人（逗号分隔，留空 = 全部）"
        required: false
        default: ""
      dry_run:
        description: "只看信号，不下单不存档"
        type: boolean
        default: false
      test_notify:
        description: "只发一条测试推送（检查 Server酱 / PushPlus / Telegram / Bark 配好没有），不跑机器人"
        type: boolean
        default: false

permissions:
  contents: write # 要把状态推到 bot-data 分支

concurrency:
  group: trade-bot # 同一时间只允许一个实例跑，防止重复下单
  cancel-in-progress: false

jobs:
  tick:
    # 总开关：仓库变量 BOT_ENABLED = true 时定时任务才真的跑；手动触发不受限制
    if: vars.BOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    # 默认用 GitHub 的机器（只能跑模拟盘）；实盘要设仓库变量 RUNNER = self-hosted，用自己的电脑/服务器跑
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_SERVER: ${{ secrets.BARK_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 测试推送
        if: inputs.test_notify == true
        run: python -m bot.notify

      - name: 取出存档（bot-data 分支）
        if: inputs.test_notify != true
        run: bash scripts/data-branch.sh checkout

      - name: 跑一步
        if: inputs.test_notify != true
        env:
          BOT_MODE: ${{ vars.BOT_MODE || 'paper' }}
          KURUMI_STATE_DIR: _data/state
          KURUMI_DATA_DIR: _data/data # 恐惧贪婪指数接口挂了就用爬虫存的那份
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_API_PASSWORD: ${{ secrets.EXCHANGE_API_PASSWORD }}
          EXCHANGE_TESTNET_API_KEY: ${{ secrets.EXCHANGE_TESTNET_API_KEY }}
          EXCHANGE_TESTNET_API_SECRET: ${{ secrets.EXCHANGE_TESTNET_API_SECRET }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m bot.run "${args[@]}"

      - name: 存档
        # 就算上一步报错也要存：可能已经成交了，账本必须留住
        if: always() && inputs.dry_run != true && inputs.test_notify != true
        run: |
          bash scripts/data-branch.sh push "bot: tick"
